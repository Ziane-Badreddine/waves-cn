name: Build Registry

on:
  push:
    branches: ["**"]
    paths:
      - "src/registry/**"
      - "registry.json"
  pull_request:
    paths:
      - "src/registry/**"
      - "registry.json"

# One run per branch at a time so two quick pushes never race on the auto-commit.
concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, build registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint registry sources
        run: npx eslint src/registry src/lib

      - name: Type check
        run: npm run types:check

      - name: Build registry
        run: npm run registry:build

      # Pull requests are checked out at a detached merge commit (refs/pull/N/merge),
      # so there is no branch to push to. Only verify the output there.
      - name: Check generated files are up to date (PR)
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- public/r; then
            echo "::error::public/r is out of date. Run 'npm run registry:build' and commit the result."
            git --no-pager diff --stat -- public/r
            exit 1
          fi

      - name: Upload generated registry
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: registry
          path: public/r
          retention-days: 1

  commit:
    name: Commit generated files
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download generated registry
        uses: actions/download-artifact@v4
        with:
          name: registry
          path: public/r

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/r
          if git diff --staged --quiet; then
            echo "Registry already up to date."
            exit 0
          fi
          git commit -m "chore: auto-build registry"
          git push origin HEAD:${{ github.ref_name }}
